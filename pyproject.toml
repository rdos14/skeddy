[project]
name = "skeddy"
version = "1.0.0"
description = "A natural-language reminder bot for Telegram — understands bounded English and Spanish dates and builds recurring schedules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "robotic0" }]
keywords = ["telegram", "bot", "aiogram", "nlp", "reminders", "scheduler"]

dependencies = [
    "aiogram>=3.13,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "APScheduler>=3.10,<4.0",
    "environs>=11.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
skeddy = "bot:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
